<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript Sample</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>
  <header>
    <h1>tabUI</h1>
  </header>
  <main>
   <div class="tab-container">
        <ul class="tab-buttons">
            <li class="tab-button active" data-id="news">最新記事</li>
            <li class="tab-button" data-id="popular">猫について</li>
            <li class="tab-button" data-id="category">興味関心</li>
        </ul>

        <div class="tab-contents">
            <div class="tab-content active" id="news">
                <h2>最新記事</h2>
                <img src="imges/01243.png"class="phot" alt="ニュース">
                <p>ニュース</p>
            </div>
            <div class="tab-content" id="popular">
                <h2>猫について</h2>
                <img src="imges/neko.jpg"class="phot" alt="猫">
                <img src="imges/siro.jpg"class="phot" alt="">
                <p>猫の写真</p>
            </div>
            <div class="tab-content" id="category">
                <h2>興味関心</h2>
                <img src="imges/okasi.jpg"class="phot" alt="">
                <img src="imges/rantan.jpg"class="phot" alt="">
                <img src="imges/snow.jpg"class="phot" alt="">
                <p>気になるもの</p>
            </div>
       
      
        


        
    </div>
  </main>
 
</body>

</html>
